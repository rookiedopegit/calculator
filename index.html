<!DOCTYPE html>
<html>
<head>
<title>SmartBuild Assistant</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.container {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    margin: 40px auto;
    width: 320px;
    border-radius: 15px;
}

input, select, button {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #00ffcc;
    cursor: pointer;
    font-weight: bold;
}

.tagline {
    font-size: 14px;
    margin-bottom: 15px;
    color: #ddd;
}

.result {
    margin-top: 15px;
    background: #222;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h2>🏗️ SmartBuild Assistant</h2>
<p class="tagline">Build Smart. Spend Smart.</p>

<div class="container">

<input id="area" placeholder="Area (sq.ft)">
<input id="floors" placeholder="Floors">

<select id="district">
<option>Chennai</option>
<option>Trichy</option>
<option>Tanjore</option>
<option>Coimbatore</option>
</select>

<h4>Select Cement Brand</h4>
<select id="cement">
<option>UltraTech</option>
<option>ACC</option>
<option>Ramco</option>
</select>

<h4>Select Sand Type</h4>
<select id="sand">
<option>Premium</option>
<option>Standard</option>
<option>Local</option>
</select>

<button onclick="calculate()">Calculate</button>

<div id="output" class="result"></div>

</div>

<script>
function calculate() {
    var area = document.getElementById("area").value;
    var floors = document.getElementById("floors").value;
    var district = document.getElementById("district").value;
    var cement = document.getElementById("cement").value;
    var sand = document.getElementById("sand").value;

    fetch("http://127.0.0.1:5000/calc", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({area, floors, district, cement, sand})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("output").innerHTML =
            "Cement Required: " + data.cement_qty + "<br>" +
            "Sand Required: " + data.sand_qty + "<br>" +
            "Total Cost: ₹" + data.total_cost + "<br><br>" +
            "💡 Suggestion: " + data.suggestion;
    });
}
</script>

</body>
</html>
